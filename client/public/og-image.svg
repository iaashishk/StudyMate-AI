<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#1B2140"/>
  <circle cx="1050" cy="150" r="300" fill="#E8A23C" opacity="0.12"/>
  <circle cx="150" cy="550" r="250" fill="#5C8368" opacity="0.1"/>
  
  <!-- Logo Icon -->
  <circle cx="160" cy="160" r="48" fill="#1B2140" stroke="#EEF1F5" stroke-width="4"/>
  <circle cx="160" cy="160" r="24" fill="#E8A23C"/>

  <!-- Brand Typography -->
  <text x="230" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#EEF1F5">StudyMate <tspan fill="#E8A23C">AI</tspan></text>

  <!-- Tagline -->
  <text x="160" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#EEF1F5">Smart Study Planner</text>
  <text x="160" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#E8A23C">for College Students</text>

  <!-- Description -->
  <text x="160" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#6B728E">AI-Powered Prioritization · Urgency &amp; Confidence Scoring · Adaptive Rescheduling</text>

  <!-- Bottom Badges -->
  <rect x="160" y="500" width="160" height="44" rx="22" fill="#EEF1F5" fill-opacity="0.1"/>
  <text x="240" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#EEF1F5" text-anchor="middle">React 19 + TS</text>

  <rect x="340" y="500" width="180" height="44" rx="22" fill="#EEF1F5" fill-opacity="0.1"/>
  <text x="430" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#EEF1F5" text-anchor="middle">Node · Express 5</text>

  <rect x="540" y="500" width="180" height="44" rx="22" fill="#EEF1F5" fill-opacity="0.1"/>
  <text x="630" y="528" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#EEF1F5" text-anchor="middle">MongoDB Mongoose</text>
</svg>
